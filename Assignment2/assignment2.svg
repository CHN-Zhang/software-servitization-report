<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900" role="img" aria-labelledby="title desc">
  <title id="title">作业 2：三种视角下的汽车类设计</title>
  <desc id="desc">分别从厂家、车主和交通管理机构视角设计的三个汽车 UML 类。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17304f" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 32px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #183153; }
      .subtitle { font: 16px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #52657b; }
      .class-name { font: 700 23px "Microsoft YaHei", "Segoe UI", sans-serif; fill: white; }
      .stereotype { font: 14px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #dcecff; }
      .member { font: 15px Consolas, "Microsoft YaHei", monospace; fill: #172b3a; }
      .label { font: 700 13px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #3e5d78; letter-spacing: 1px; }
      .note { font: 15px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #40566b; }
      .card { fill: white; stroke: #6c849d; stroke-width: 1.5; filter: url(#shadow); }
      .divider { stroke: #b8c6d3; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1900" height="820" fill="#f4f7fb"/>
  <text x="950" y="55" text-anchor="middle" class="title">作业 2：三种视角下的汽车类设计</text>
  <text x="950" y="84" text-anchor="middle" class="subtitle">同一现实对象在不同业务边界中具有不同的属性与行为</text>

  <!-- 厂家视角 -->
  <g transform="translate(50 120)">
    <rect class="card" width="560" height="680" rx="10"/>
    <path d="M10 0 H550 A10 10 0 0 1 560 10 V88 H0 V10 A10 10 0 0 1 10 0" fill="#2166a5"/>
    <text x="280" y="30" text-anchor="middle" class="stereotype">«厂家视角»</text>
    <text x="280" y="64" text-anchor="middle" class="class-name">Car</text>
    <text x="22" y="116" class="label">ATTRIBUTES</text>
    <text class="member" x="22" y="147">
      <tspan x="22" dy="0">- vin: String</tspan>
      <tspan x="22" dy="28">- brand: String</tspan>
      <tspan x="22" dy="28">- model: String</tspan>
      <tspan x="22" dy="28">- productionDate: LocalDate</tspan>
      <tspan x="22" dy="28">- engineNumber: String</tspan>
      <tspan x="22" dy="28">- color: String</tspan>
      <tspan x="22" dy="28">- qualityStatus: QualityStatus</tspan>
      <tspan x="22" dy="28">- factoryPrice: BigDecimal</tspan>
    </text>
    <line x1="0" y1="382" x2="560" y2="382" class="divider"/>
    <text x="22" y="411" class="label">OPERATIONS</text>
    <text class="member" x="22" y="442">
      <tspan x="22" dy="0">+ assemble(): void</tspan>
      <tspan x="22" dy="28">+ configure(color: String): void</tspan>
      <tspan x="22" dy="28">+ inspectQuality(): boolean</tspan>
      <tspan x="22" dy="28">+ calculateProductionCost(): BigDecimal</tspan>
      <tspan x="22" dy="28">+ ship(dealerId: String): void</tspan>
    </text>
  </g>

  <!-- 车主视角 -->
  <g transform="translate(670 120)">
    <rect class="card" width="560" height="680" rx="10"/>
    <path d="M10 0 H550 A10 10 0 0 1 560 10 V88 H0 V10 A10 10 0 0 1 10 0" fill="#19705f"/>
    <text x="280" y="30" text-anchor="middle" class="stereotype">«车主视角»</text>
    <text x="280" y="64" text-anchor="middle" class="class-name">Car</text>
    <text x="22" y="116" class="label">ATTRIBUTES</text>
    <text class="member" x="22" y="147">
      <tspan x="22" dy="0">- vin: String</tspan>
      <tspan x="22" dy="28">- plateNumber: String</tspan>
      <tspan x="22" dy="28">- brand: String</tspan>
      <tspan x="22" dy="28">- model: String</tspan>
      <tspan x="22" dy="28">- purchaseDate: LocalDate</tspan>
      <tspan x="22" dy="28">- mileage: double</tspan>
      <tspan x="22" dy="28">- fuelLevel: double</tspan>
      <tspan x="22" dy="28">- insuranceExpiryDate: LocalDate</tspan>
    </text>
    <line x1="0" y1="382" x2="560" y2="382" class="divider"/>
    <text x="22" y="411" class="label">OPERATIONS</text>
    <text class="member" x="22" y="442">
      <tspan x="22" dy="0">+ start(): void</tspan>
      <tspan x="22" dy="28">+ stop(): void</tspan>
      <tspan x="22" dy="28">+ accelerate(targetSpeed: double): void</tspan>
      <tspan x="22" dy="28">+ brake(): void</tspan>
      <tspan x="22" dy="28">+ refuel(amount: double): void</tspan>
      <tspan x="22" dy="28">+ scheduleMaintenance(date: LocalDate): void</tspan>
      <tspan x="22" dy="28">+ calculateRemainingRange(): double</tspan>
    </text>
  </g>

  <!-- 交通管理机构视角 -->
  <g transform="translate(1290 120)">
    <rect class="card" width="560" height="680" rx="10"/>
    <path d="M10 0 H550 A10 10 0 0 1 560 10 V88 H0 V10 A10 10 0 0 1 10 0" fill="#6b4a9f"/>
    <text x="280" y="30" text-anchor="middle" class="stereotype">«交通管理机构视角»</text>
    <text x="280" y="64" text-anchor="middle" class="class-name">Car</text>
    <text x="22" y="116" class="label">ATTRIBUTES</text>
    <text class="member" x="22" y="147">
      <tspan x="22" dy="0">- vin: String</tspan>
      <tspan x="22" dy="28">- plateNumber: String</tspan>
      <tspan x="22" dy="28">- ownerId: String</tspan>
      <tspan x="22" dy="28">- vehicleType: VehicleType</tspan>
      <tspan x="22" dy="28">- registrationDate: LocalDate</tspan>
      <tspan x="22" dy="28">- inspectionExpiryDate: LocalDate</tspan>
      <tspan x="22" dy="28">- insuranceStatus: InsuranceStatus</tspan>
      <tspan x="22" dy="28">- violationPoints: int</tspan>
      <tspan x="22" dy="28">- status: RegistrationStatus</tspan>
    </text>
    <line x1="0" y1="410" x2="560" y2="410" class="divider"/>
    <text x="22" y="439" class="label">OPERATIONS</text>
    <text class="member" x="22" y="470">
      <tspan x="22" dy="0">+ register(): void</tspan>
      <tspan x="22" dy="28">+ transferOwnership(newOwnerId: String): void</tspan>
      <tspan x="22" dy="28">+ recordInspection(result: boolean): void</tspan>
      <tspan x="22" dy="28">+ recordViolation(points: int): void</tspan>
      <tspan x="22" dy="28">+ queryViolations(): List&lt;Violation&gt;</tspan>
      <tspan x="22" dy="28">+ cancelRegistration(): void</tspan>
    </text>
  </g>

  <text x="950" y="850" text-anchor="middle" class="note">说明：“-”表示私有成员，“+”表示公有方法；三个类为不同业务边界的独立抽象，不存在继承关系。</text>
</svg>
